name: Fabriquer le fichier AAB
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Android SDK
      uses: android-actions/setup-android@v3
    - name: Build AAB
      run: |
        npm install -g cordova
        cordova create monapp com.dealfinder.ai DealFinder
        cd monapp
        cordova platform add android
        cp -R ../index.html www/
        cordova build android --release -- --packageType=bundle
    - name: Sauvegarder AAB
      uses: actions/upload-artifact@v4
      with:
        name: MonApplicationAAB
        path: monapp/platforms/android/app/build/outputs/bundle/release/*.aab
