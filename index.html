<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealFinder AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f3ec; /* Couleur crème originale */
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            background-color: #fff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0dfd5;
        }
        .logo {
            color: #1b5e20; /* Vert original */
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo .dot {
            width: 10px;
            height: 10px;
            background-color: #2ec4b6;
            border-radius: 50%;
        }
        .main-content {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .profile-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .profile-card {
            background: #e1dfd5;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .profile-avatar {
            width: 50px;
            height: 50px;
            background-color: #c9c7bd;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: #1b5e20;
        }
        .profile-details .name {
            font-weight: bold;
            font-size: 18px;
        }
        .profile-details .email {
            color: #666;
            font-size: 14px;
        }
        .btn-disconnect {
            background: none;
            border: 1px solid #b71c1c;
            color: #b71c1c;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-admin-panel {
            background-color: #f4f3ec;
            border: 1px solid #1b5e20;
            color: #1b5e20;
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .admin-modal {
            background-color: #fff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            padding: 20px;
            margin-top: 10px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }
        .tab {
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
        }
        .tab.active {
            background-color: #1b5e20;
            color: #fff;
            border-color: #1b5e20;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            text-transform: uppercase;
            font-size: 12px;
            color: #777;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0dfd5;
            border-radius: 12px;
            box-sizing: border-box;
            background-color: #fafafa;
            font-size: 15px;
        }
        .info-disclaimer {
            font-size: 13px;
            color: #888;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        .btn-save-master {
            background-color: #1b5e20;
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .status-box {
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🛠 ... DealFinder AI <div class="dot"></div></div>
    </div>

    <div class="main-content">
        <div class="profile-title">Profil</div>

        <div class="profile-card">
            <div class="profile-info">
                <div class="profile-avatar">M</div>

                    <div class="name">Mariama Gueye</div>
                    <div class="email">sowgueye.mariama@gmail.com</div>
                </div>
            </div>
            <button class="btn-disconnect">Se déconnecter</button>
        </div>

        <button class="btn-admin-panel">🛠 Panneau d'administration</button>

        <div class="admin-modal">
            <div class="tabs">
                <button class="tab" onclick="switchTab('produits')">Produits</button>
                <button class="tab active" onclick="switchTab('affiliation')">Affiliation</button>
                <button class="tab" onclick="switchTab('cles')">🔑 Clés</button>
                <button class="tab" onclick="switchTab('notifs')">📢 Notifs</button>

            <div id="adminFormContent">

                <div id="tab-affiliation" class="tab-pane">
                    <div class="form-group">
                        <label>Tag d'affiliation</label>
                        <input type="text" id="affTag" placeholder="vide">
                    </div>
                    <div class="form-group">
                        <label>Modèle de lien de tracking</label>
                        <input type="text" id="affTrack" placeholder="vide">
                    </div>
                    <div class="info-disclaimer">
                        Placeholders : {url} = lien produit · {tag} = ton tag · {clickId} = id du clic. Tant que ces champs sont vides, AUCUN tag n'est attaché aux liens.
                    </div>
                </div>

                <!-- ONGLET PRODUITS (SANS CHAMP MARQUE + PHOTO REQUISE) -->
                <div id="tab-produits" class="tab-pane" style="display:none;">
                    <div class="form-group">
                        <label>Nom du produit *</label>
                        <input type="text" id="prodName">

                    <div class="form-group">
                        <label>Prix (FCFA) *</label>
                        <input type="number" id="prodPrice">

                    <div class="form-group">
                        <label>Lien produit *</label>
                        <input type="text" id="prodLink">
                    </div>
                    <div class="form-group">
                        <label>Photo du produit (URL obligatoire) *</label>
                        <input type="text" id="prodImage" placeholder="https://...">
                    </div>
                </div>
            </div>

            <button class="btn-save-master" onclick="submitAdminData()">💾 Enregistrer les modifications</button>
            <div id="statusNotice" class="status-box"></div>
        </div>
    </div>

<script>
    const API_URL = "https://onrender.com";
    const ADMIN_EMAIL = "sowgueye.mariama@gmail.com"; 
    let currentActiveTab = "affiliation";

    function switchTab(tabId) {
        currentActiveTab = tabId;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');

        if(tabId === 'affiliation') {
            document.getElementById('tab-affiliation').style.display = 'block';
            document.getElementById('tab-produits').style.display = 'none';
        } else if(tabId === 'produits') {
            document.getElementById('tab-affiliation').style.display = 'none';
            document.getElementById('tab-produits').style.display = 'block';
        } else {
            document.getElementById('tab-affiliation').style.display = 'none';
            document.getElementById('tab-produits').style.display = 'none';
        }
    }

    function feedback(text, success) {
        const box = document.getElementById('statusNotice');
        box.innerText = text;
        box.style.background = success ? "#d4edda" : "#f8d7da";
        box.style.color = success ? "#155724" : "#721c24";
        box.style.display = "block";
        setTimeout(() => box.style.display = "none", 4000);
    }
