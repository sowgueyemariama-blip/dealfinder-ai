    const API_URL = "https://dealfinder-backend-c758.onrender.com";

    function showStatus(element, text, isSuccess) {
        element.innerText = text;
        element.className = 'status ' + (isSuccess ? 'success' : 'error');
        element.style.display = 'block';
        setTimeout(() => element.style.display = 'none', 5000);
    }

    // Récupérer et lister en direct les boutiques actives configurées
    async function loadActiveShops() {
        try {
            const res = await fetch(`${API_URL}/api/affiliations`);
            const data = await res.json();
            const box = document.getElementById('activeShops');
            if(data.length === 0) {
                box.innerHTML = "Aucune boutique enregistrée pour le moment.";
                return;
            }
            box.innerHTML = "<strong>Boutiques actives :</strong> " + data.map(s => s.shop_name).join(', ');
        } catch(e) { 
            document.getElementById('activeShops').innerText = "Erreur de connexion réseau."; 
        }
    }

        e.preventDefault();
        const statusBox = document.getElementById('settingsStatus');
        
        const payload = {
            shop_name: document.getElementById('shopName').value,
            global_link: document.getElementById('shopLink').value

            const res = await fetch(`${API_URL}/api/affiliations`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)

                showStatus(statusBox, "✅ Données d'affiliation enregistrées avec succès !", true);

                loadActiveShops();

                showStatus(statusBox, "❌ Le serveur a rencontré un problème.", false); 
            }
        } catch(err) { 
            showStatus(statusBox, "❌ Impossible de joindre votre serveur Render.", false); 
        }
    });
